<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Valentine?</title>
  <style>
    :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fff7fb; }
    .card {
      width: min(520px, calc(100vw - 32px));
      background: white;
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 12px 40px rgba(0,0,0,.08);
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    h1 { margin: 0 0 10px; font-size: 28px; }
    p { margin: 0 0 18px; color: #444; }
    .btnrow { display: flex; justify-content: center; gap: 12px; margin-top: 10px; }
    button {
      border: 0;
      border-radius: 999px;
      padding: 12px 18px;
      font-size: 16px;
      cursor: pointer;
      user-select: none;
    }
    #yesBtn { background: #ff3b7a; color: white; }
    #yesBtn:hover { filter: brightness(0.95); }
    #noBtn {
      background: #f1f1f1;
      color: #222;
      position: relative;
    }
    .success {
      display: none;
      margin-top: 16px;
      font-size: 18px;
      color: #0a7d3b;
      font-weight: 700;
    }
    .hearts {
      pointer-events: none;
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity .25s ease;
      background:
        radial-gradient(circle at 20% 30%, rgba(255,59,122,.20), transparent 40%),
        radial-gradient(circle at 80% 40%, rgba(255,59,122,.18), transparent 45%),
        radial-gradient(circle at 45% 80%, rgba(255,59,122,.16), transparent 45%);
    }
    .card.yay .hearts { opacity: 1; }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="hearts"></div>
    <h1>Ryan 💌</h1>
    <p>Will you be my Valentine?</p>

    <div class="btnrow" id="btnRow">
      <button id="yesBtn">Yes 😍</button>
      <button id="noBtn">No 🙃</button>
    </div>

    <div class="success" id="successMsg">YAYYYYY. See you on Valentine’s 💘</div>
  </div>

  <script>
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    const btnRow = document.getElementById("btnRow");
    const card = document.getElementById("card");
    const successMsg = document.getElementById("successMsg");

    // Make the "No" button dodge the cursor (desktop + trackpad).
    // (On phones, there is no hover — but tapping "No" will still move it.)
    function dodge() {
      const rowRect = btnRow.getBoundingClientRect();
      const btnRect = noBtn.getBoundingClientRect();

      // How far can we move inside the row without leaving it?
      const maxLeft = rowRect.width - btnRect.width;

      // Pick a new x position and a tiny y wiggle
      const newLeft = Math.max(0, Math.min(maxLeft, Math.random() * maxLeft));
      const newUp = (Math.random() * 16) - 8;

      noBtn.style.position = "absolute";
      noBtn.style.left = `${newLeft}px`;
      noBtn.style.top = `${newUp}px`;
    }

    // When the cursor gets close, move.
    document.addEventListener("mousemove", (e) => {
      const r = noBtn.getBoundingClientRect();
      const cx = r.left + r.width / 2;
      const cy = r.top + r.height / 2;
      const dist = Math.hypot(e.clientX - cx, e.clientY - cy);

      if (dist < 120) dodge();
    });

    // If he somehow lands on it, move anyway 😈
    noBtn.addEventListener("mouseenter", dodge);
    noBtn.addEventListener("click", (e) => { e.preventDefault(); dodge(); });

    // Yes flow
    yesBtn.addEventListener("click", () => {
      card.classList.add("yay");
      btnRow.style.display = "none";
      successMsg.style.display = "block";
    });

    // Make sure absolute positioning still lines up inside the row
    btnRow.style.position = "relative";
    btnRow.style.height = "56px";
  </script>
</body>
</html>
